services:
  postgres:
    image: postgres:16-alpine
    container_name: pricehatke-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pricehatke
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pricehatke-prod-redis
    restart: always
    command: redis-server --requirepass password
    ports:
      - "6379:6379"
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./pricehatke-api
      dockerfile: Dockerfile
    container_name: pricehatke-prod-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pricehatke?schema=public
      REDIS_URL: redis://default:password@redis:6379
      JWT_ACCESS_SECRET: prod_access_secret_change_in_production
      JWT_REFRESH_SECRET: prod_refresh_secret_change_in_production
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./pricehatke-web
      dockerfile: Dockerfile
    container_name: pricehatke-prod-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: prod_nextauth_secret_change_in_production
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata_prod:
  redisdata_prod:
